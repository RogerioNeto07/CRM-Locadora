<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar jogo</title>
</head>
<style>
         body, h1, h2, p, ul, li, a {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 20px;
        }

        nav {
            background: #222;
            padding: 10px;
            margin-bottom: 20px;
        }

        nav a {
            color: #fff;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .messages {
            list-style: none;
            margin-bottom: 20px;
        }

        .messages li {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .messages .success {
            background: #d4f7d4;
            border-left: 4px solid #2ecc71;
        }

        .messages .error {
            background: #f8d7da;
            border-left: 4px solid #c0392b;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 20px;
            font-size: 20px;
        }

        img {
            max-width: 150px;
            border-radius: 5px;
        }

        p {
            margin: 5px 0 10px 0;
        }

        hr {
            margin: 20px 0;
            border: none;
            border-bottom: 1px solid #ccc;
        }

        a.editar-link {
            margin-left: 10px;
            color: blue;
        }
</style>
<body>
    <h1>Editar Produto: {{ form.instance.nome }}</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>

<hr>

<h2>Ações</h2>
<br>
<a href="{% url 'deletar_jogo' object.pk %}" style="background-color: red; color: white; padding: 10px; text-decoration: none; border-radius: 5px;">Deletar Jogo</a>
<a href="{% url 'index' %}" style="background-color: rgb(41, 209, 55); color: white; padding: 10px; text-decoration: none; border-radius: 5px;" >Voltar para página inicial</a>

</body>
</html>
