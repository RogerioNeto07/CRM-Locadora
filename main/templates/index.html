<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Locadora</title>
</head>
    <nav>
        <a href="{% url 'index' %}">Inicio</a>  <a href="{% url 'adicionar' %}">Adicionar jogo</a>  <a href="{% url 'registrarpedido' %}">Registrar Pedido</a>  <a href="{% url 'pedidos' %}">Lista de pedidos</a>
    </nav>
    <style>
        body, h1, h2, p, ul, li, a {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 0;
            margin: 20px;
        }

        nav {
            background: #fff;
            position: relative;
            top: -20px;
            left: -20px;
            width: calc(100% + 40px);
            padding: 10px 20px;
        }

        nav a {
            color: #fff;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .messages {
            list-style: none;
            margin-bottom: 20px;
        }

        .messages li {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .messages .success {
            background: #d4f7d4;
            border-left: 4px solid #2ecc71;
        }

        .messages .error {
            background: #f8d7da;
            border-left: 4px solid #c0392b;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 20px;
            font-size: 20px;
        }

        img {
            max-width: 150px;
            border-radius: 5px;
        }

        p {
            margin: 5px 0 10px 0;
        }

        hr {
            margin: 20px 0;
            border: none;
            border-bottom: 1px solid #ccc;
        }

        a.editar-link {
            margin-left: 10px;
            color: blue;
        }
        .card-imagem {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
        a {
            color: #333;
            text-decoration: none; 
        }

        a:visited {
            color: #333;
        }

        a:hover {
            color: #555;
        }
    </style>
    <body>
    {% if messages %}
        <ul class="messages">
    {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
        </ul>
    {% endif %}
    <h1>Jogos Disponíveis:</h1>
    {% for jogo in jogos %}
    <h2>
        {% if jogo.imagem %}
            <a href="{% url 'details' jogo.id %}"><img src="{{ jogo.imagem.url }}" alt="{{ jogo.nome }}" class="card-imagem"></a>
            <br>
        {% endif %}
        <a href="{% url 'details' jogo.id %}">{{ jogo.nome }}</a>
        <a href="{% url 'editar_jogo' jogo.id %}" style="margin-left: 10px; color: blue;">Editar</a>
    </h2>
    <p>Preço: {{jogo.preço}}</p>
    <hr>
    {% endfor %}
</body>
</html>
