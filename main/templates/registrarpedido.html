<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar pedido</title>
</head>
<style>
         body, h1, h2, p, ul, li, a {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 20px;
        }

        nav {
            background: #222;
            padding: 10px;
            margin-bottom: 20px;
        }

        nav a {
            color: #fff;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .messages {
            list-style: none;
            margin-bottom: 20px;
        }

        .messages li {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .messages .success {
            background: #d4f7d4;
            border-left: 4px solid #2ecc71;
        }

        .messages .error {
            background: #f8d7da;
            border-left: 4px solid #c0392b;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 20px;
            font-size: 20px;
        }

        img {
            max-width: 150px;
            border-radius: 5px;
        }

        p {
            margin: 5px 0 10px 0;
        }

        hr {
            margin: 20px 0;
            border: none;
            border-bottom: 1px solid #ccc;
        }

        a.editar-link {
            margin-left: 10px;
            color: blue;
        }
</style>
<body>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>

        <a href="{% url 'index' %}">página inicial</a>
</body>
</html>
